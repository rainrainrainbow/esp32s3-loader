name: Build ESP32-S3 Loader

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32s3
          path: '.'

      - name: Build firmware
        run: |
          . ${IDF_PATH}/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-loader-firmware
          path: |
            build/*.bin
            build/bootloader/*.bin
            build/partition_table/*.bin
            build/flash_args
          retention-days: 30

      - name: Create merged binary
        run: |
          . ${IDF_PATH}/export.sh
          idf.py merge-bin -o esp32s3-loader-merged.bin

      - name: Upload merged binary
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-loader-merged-bin
          path: esp32s3-loader-merged.bin
          retention-days: 30