name: Build ESP32-S3 Loader

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        run: |
          . ${IDF_PATH}/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-loader-firmware
          path: |
            build/*.bin
            build/bootloader/*.bin
            build/partition_table/*.bin
            build/flash_args
          retention-days: 30

      - name: Create merged binary
        run: |
          . ${IDF_PATH}/export.sh
          esptool.py --chip esp32s3 merge_bin -o esp32s3-loader-merged.bin @build/flash_args

      - name: Upload merged binary
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-loader-merged-bin
          path: esp32s3-loader-merged.bin
          retention-days: 30
